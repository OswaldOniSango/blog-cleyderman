backend:
  name: github
  repo: REEMPLAZAR_USUARIO/REEMPLAZAR_REPOSITORIO
  branch: main
  base_url: REEMPLAZAR_URL_DE_AUTENTICACION

publish_mode: editorial_workflow
media_folder: public/images
public_folder: /images
locale: es

collections:
  - name: historias
    label: Historias
    label_singular: Historia
    folder: src/content/stories
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Descripción, name: description, widget: text }
      - { label: Fecha, name: date, widget: datetime, format: YYYY-MM-DD, date_format: DD/MM/YYYY, time_format: false }
      - { label: Imagen, name: image, widget: image, required: false }
      - { label: Borrador, name: draft, widget: boolean, default: true }
      - { label: Destacada, name: featured, widget: boolean, default: false }
      - { label: Etiquetas, name: tags, widget: list, required: false, default: [] }
      - { label: Historia, name: body, widget: markdown }
