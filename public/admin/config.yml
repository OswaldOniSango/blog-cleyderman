backend:
  name: github
  repo: OswaldOniSango/blog-cleyderman
  branch: main

publish_mode: editorial_workflow
media_folder: public/images
public_folder: /blog-cleyderman/images
locale: es
site_url: https://oswaldonisango.github.io/blog-cleyderman/
display_url: https://oswaldonisango.github.io/blog-cleyderman/

collections:
  - name: historias
    label: Historias
    label_singular: Historia
    folder: src/content/stories
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Descripción, name: description, widget: text }
      - { label: Fecha, name: date, widget: datetime, format: YYYY-MM-DD, date_format: DD/MM/YYYY, time_format: false }
      - { label: Imagen, name: image, widget: image, required: false }
      - { label: Borrador, name: draft, widget: boolean, default: true }
      - { label: Destacada, name: featured, widget: boolean, default: false }
      - { label: Etiquetas, name: tags, widget: list, required: false, default: [] }
      - { label: Historia, name: body, widget: markdown }

  - name: paginas
    label: Páginas
    files:
      - name: sobre-mi
        label: Sobre mí
        file: src/content/pages/sobre-mi.md
        fields:
          - { label: Nombre, name: title, widget: string }
          - { label: Rótulo superior, name: eyebrow, widget: string, default: El autor }
          - { label: Descripción para buscadores, name: description, widget: text }
          - { label: Biografía, name: body, widget: markdown }
